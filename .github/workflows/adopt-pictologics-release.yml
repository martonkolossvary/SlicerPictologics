name: Adopt latest qualified Pictologics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Stable X.Y.Z release (empty = latest on PyPI)"
        required: false
        type: string
  repository_dispatch:
    types: [pictologics-release]

permissions:
  contents: read

concurrency:
  group: adopt-pictologics
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.release.outputs.changed }}
      revision: ${{ steps.base.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: base
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Discover a published stable wheel without changing the pin
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
        run: python scripts/resolve_pictologics_release.py --version "${MANUAL_VERSION:-${DISPATCH_VERSION:-}}"
      - name: Report discovery
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANGED: ${{ steps.release.outputs.changed }}
        run: echo "PyPI release $VERSION; adoption needed=$CHANGED" >> "$GITHUB_STEP_SUMMARY"

  qualify:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    uses: ./.github/workflows/compatibility.yml
    with:
      version: ${{ needs.discover.outputs.version }}
      revision: ${{ needs.discover.outputs.revision }}

  publish:
    needs: [discover, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.revision }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Publish only the qualified pin, without force-pushing
        env:
          VERSION: ${{ needs.discover.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Recheck publication/yank status after the potentially lengthy gates.
          python scripts/resolve_pictologics_release.py --version "$VERSION"
          python scripts/bump_pictologics_requirement.py "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- PictologicsSlicer/requirements-pictologics.txt
          git commit -m "ENH: Adopt compatibility-qualified Pictologics $VERSION"
          # If main changed after qualification, the fast-forward-only push fails.
          # The next scheduled run qualifies the candidate against the new HEAD.
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          echo "Published Pictologics $VERSION after all compatibility gates passed." >> "$GITHUB_STEP_SUMMARY"
